 [5,11],[6,11],[7,11],[8,11],[9,11],[9,6],[9,7],[9,8],[9,9],[9,10],
 [10,6],[11,6],[12,6],[13,6],[13,7],[13,8],[13,9],[14,9]].forEach(([x,y])=>{
  dirt.add(x+','+y); dirt.add((x+1)+','+y); dirt.add(x+','+(y+1));
});
const player={x:SPAWN.x,y:SPAWN.y,facing:'s'};
const slime={x:SPAWN.x-24,y:SPAWN.y+8,sx:SPAWN.x-24,sy:SPAWN.y+8,facing:'s'};
function collides(x,y,rad){
  for(const t of trees){const dx=x-t.x,dy=y-t.y;if(dx*dx+dy*dy<(rad+8)*(rad+8))return true;}
  for(const p of posts){const dx=x-p.x,dy=y-p.y;if(dx*dx+dy*dy<(rad+5)*(rad+5))return true;}
  return false;
}
function resize(){
  const bar=document.getElementById('bar').offsetHeight;
  const w=window.innerWidth, h=window.innerHeight-bar;
  canvas.style.height=h+'px';
  canvas.width=Math.floor(w*devicePixelRatio);
  canvas.height=Math.floor(h*devicePixelRatio);
  ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
}
window.addEventListener('resize',resize);
window.addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true; if(e.key.startsWith('Arrow')||e.key===' ')e.preventDefault();});
window.addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});

function setKnob(dx,dy){
  const max=33;
  knob.style.left=(33+dx*max)+'px';
  knob.style.top=(33+dy*max)+'px';
}
function joyFromEvent(e){
  const r=joyEl.getBoundingClientRect();
  const cx=r.left+r.width/2, cy=r.top+r.height/2;
  let dx=e.clientX-cx, dy=e.clientY-cy;
  const len=Math.hypot(dx,dy)||1;
  const max=r.width*0.42;
  if(len>max){dx=dx/len*max; dy=dy/len*max;}
  stick.dx=dx/max; stick.dy=dy/max; stick.active=true;
  setKnob(stick.dx,stick.dy);
}
joyEl.addEventListener('pointerdown',e=>{joyEl.setPointerCapture(e.pointerId); joyFromEvent(e);});
joyEl.addEventListener('pointermove',e=>{if(!stick.active)return; joyFromEvent(e);});
joyEl.addEventListener('pointerup',()=>{stick.active=false;stick.dx=0;stick.dy=0;setKnob(0,0);});
joyEl.addEventListener('pointercancel',()=>{stick.active=false;stick.dx=0;stick.dy=0;setKnob(0,0);});

// also allow drag on canvas as secondary control
canvas.addEventListener('pointerdown',e=>{
  if(e.target===joyEl)return;
  // ignore if pressing left bottom joy region roughly
});

let last=performance.now();
const worldW=MAP_W*TILE, worldH=MAP_H*TILE;
function drawFoot(im,x,y){ ctx.drawImage(im, x-im.width/2, y-im.height); }
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now;
  const cssW=canvas.width/devicePixelRatio, cssH=canvas.height/devicePixelRatio;
  let mx=0,my=0;
  if(keys['w']||keys['arrowup'])my-=1;
  if(keys['s']||keys['arrowdown'])my+=1;
  if(keys['a']||keys['arrowleft'])mx-=1;
  if(keys['d']||keys['arrowright'])mx+=1;
  if(stick.active){mx=stick.dx; my=stick.dy;}
  const mlen=Math.hypot(mx,my);
  if(mlen>0.08){
    mx/=mlen; my/=mlen;
    if(Math.abs(mx)>Math.abs(my)) player.facing=mx>0?'e':'w';
    else player.facing=my>0?'s':'n';
  } else {mx=0;my=0;}
  const spd=(inPond(player.x,player.y)?60:120)*dt;
  const nx=Math.max(12,Math.min(worldW-12,player.x+mx*spd));
  const ny=Math.max(12,Math.min(worldH-12,player.y+my*spd));
  if(!collides(nx,player.y,7))player.x=nx;
  if(!collides(player.x,ny,7))player.y=ny;

  const toX=player.x-slime.x, toY=player.y-8-slime.y, toLen=Math.hypot(toX,toY);
  if(toLen>28){
    const destX=player.x-(toX/toLen)*28, destY=player.y-8-(toY/toLen)*28;
    slime.sx+=(destX-slime.sx)*(1-Math.exp(-dt/0.12));
    slime.sy+=(destY-slime.sy)*(1-Math.exp(-dt/0.12));
    const sx=slime.sx-slime.x, sy=slime.sy-slime.y, sl=Math.hypot(sx,sy);
    if(sl>0.5){
      const ss=Math.min(100*dt,sl);
      slime.x+=(sx/sl)*ss; slime.y+=(sy/sl)*ss;
      if(Math.abs(sx)>Math.abs(sy)) slime.facing=sx>0?'e':'w';
      else slime.facing=sy>0?'s':'n';
    }
  } else {slime.sx=slime.x; slime.sy=slime.y;}

  if(!complete){
    const bx=player.x-BALL.x, by=player.y-BALL.y;
    if(bx*bx+by*by<14*14){ complete=true; win.classList.add('show'); hint.textContent='通关成功'; }
  }

  let camX=Math.max(0,Math.min(Math.max(0,worldW-cssW),player.x-cssW/2));
  let camY=Math.max(0,Math.min(Math.max(0,worldH-cssH),player.y-cssH/2));
  ctx.imageSmoothingEnabled=false;
  ctx.fillStyle='#0e1210'; ctx.fillRect(0,0,cssW,cssH);
  ctx.save(); ctx.translate(-camX,-camY);
  for(let y=0;y<MAP_H;y++)for(let x=0;x<MAP_W;x++){
    const im=dirt.has(x+','+y)?imgs.dirt:imgs.grass;
    ctx.drawImage(im,x*TILE,y*TILE,TILE,TILE);
  }
  const pond=imgs.pond; ctx.drawImage(pond,POND.x-pond.width/2,POND.y-pond.height/2);
  for(const p of posts) drawFoot(imgs.post,p.x,p.y);
  for(const t of trees) drawFoot(imgs[t.k],t.x,t.y);
  drawFoot(imgs.red_ball,BALL.x,BALL.y+imgs.red_ball.height/2);
  drawFoot(imgs['slime_'+slime.facing]||imgs.slime_s, slime.x, slime.y);
  drawFoot(imgs['wizard_'+player.facing]||imgs.wizard_s, player.x, player.y);
  ctx.restore();
  requestAnimationFrame(frame);
}
loadAll().then(()=>{ resize(); requestAnimationFrame(frame); }).catch(e=>{hint.textContent='资源加载失败: '+e;});
</script>
</body>
</html>
